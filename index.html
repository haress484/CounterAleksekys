<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Aleksekys</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050805;
            color: #00ff66;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        header {
            background-color: rgba(18, 24, 18, 0.85);
            border-bottom: 1px solid rgba(0, 255, 102, 0.2);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }

        .hero-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 120px 20px 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .image-wrapper {
            width: 100%;
            max-width: 800px;
            border: 2px solid #00ff66;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.15);
            margin-bottom: 40px;
            background-color: #121812;
        }

        .game-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .content-wrapper {
            max-width: 700px;
            width: 100%;
        }

        .game-title {
            font-size: 42px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
        }

        .game-description {
            color: #8da390;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .download-button {
            display: inline-block;
            background-color: #00ff66;
            color: #050805;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 18px 50px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 255, 102, 0.4);
            transition: all 0.3s ease;
        }

        .download-button:hover {
            background-color: #00cc52;
            box-shadow: 0 8px 30px rgba(0, 255, 102, 0.7);
            transform: translateY(-3px);
        }

        .limbo-container {
            display: none;
            position: relative;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        .limbo-btn {
            position: absolute;
            background-color: #0a110a;
            color: #00ff66;
            border: 1px solid #00ff66;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: left 0.15s linear, top 0.15s linear, background-color 0.3s, box-shadow 0.3s;
        }

        .limbo-btn:hover {
            background-color: #121812;
        }

        .limbo-btn.correct-glow {
            background-color: #00ff66 !important;
            color: #050805 !important;
            box-shadow: 0 0 40px #00ff66, inset 0 0 10px #ffffff;
            transform: scale(1.05);
            z-index: 10;
        }

        .unclickable {
            pointer-events: none;
        }

        #crashScreen {
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            background: rgba(15, 0, 0, 0.95); 
            z-index: 9999; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column;
            color: #ff3333;
            font-family: monospace;
            overflow: hidden;
        }

        .crash-title {
            font-size: 40px; 
            text-transform: uppercase; 
            letter-spacing: 5px; 
            text-shadow: 0 0 15px #ff0000; 
            margin-bottom: 20px;
            text-align: center;
            z-index: 10001;
        }

        .crash-text {
            color: #ff6666; 
            font-size: 18px;
            text-align: center;
            z-index: 10001;
        }
    </style>
</head>

        // 👆👆👆 👆👆👆 👆👆👆

        const mainBtn = document.getElementById('mainDownloadBtn');
        const limboBox = document.getElementById('limboBox');
        const bgMusic = document.getElementById('limboAudio');
        const crashScreen = document.getElementById('crashScreen');

        const REAL_GAME_URL = 'https://github.com/haress484/CounterAleksekys/releases/download/v1.0/CounterAleksekys.zip
'; 
        const SHUFFLE_SPEED = 140; 
        const SHUFFLE_COUNT = 72;  
        const GLOW_TIME = 700;     

        let buttonsArray = [];
        let positionsArray = [];
        let isShuffling = false;

        mainBtn.addEventListener('click', () => {
            mainBtn.style.display = 'none';
            limboBox.style.display = 'block';
            startLimboGame();
        });

        function startLimboGame() {
            const isMobile = window.innerWidth < 600;
            const cols = isMobile ? 2 : 4;
            const rows = isMobile ? 4 : 2;
            
            const btnWidth = isMobile ? 48 : 23;
            const btnHeight = 50;
            const gapY = 15;

            limboBox.style.height = `${rows * (btnHeight + gapY)}px`;

            const correctIndex = Math.floor(Math.random() * 8);

            for (let i = 0; i < 8; i++) {
                const btn = document.createElement('div');
                btn.className = 'limbo-btn unclickable';
                btn.innerText = 'Скачать';
                btn.style.width = `${btnWidth}%`;
                btn.style.height = `${btnHeight}px`;

                const col = i % cols;
                const row = Math.floor(i / cols);
                const leftPos = col * (btnWidth + (isMobile ? 4 : 2.6));
                const topPos = row * (btnHeight + gapY);

                positionsArray.push({ left: `${leftPos}%`, top: `${topPos}px` });
                
                btn.style.left = positionsArray[i].left;
                btn.style.top = positionsArray[i].top;

                if (i === correctIndex) {
                    btn.dataset.isCorrect = "true";
                    btn.classList.add('correct-glow'); 
                } else {
                    btn.dataset.isCorrect = "false";
                }

                btn.addEventListener('click', handleButtonClick);
                buttonsArray.push(btn);
                limboBox.appendChild(btn);
            }

            setTimeout(() => {
                buttonsArray[correctIndex].classList.remove('correct-glow');
                
                bgMusic.currentTime = 0;
                bgMusic.volume = 0.6;
                bgMusic.play().catch(e => console.log("Браузер заблокировал автоматический звук"));

                startShuffling();
            }, GLOW_TIME); 
        }

        // Абсолютно рандомное хаотичное перемешивание всех кнопок разом
        function startShuffling() {
            isShuffling = true;
            let shuffleCounter = 0;

            const shuffleInterval = setInterval(() => {
                // Полная тасовка массива позиций на каждом шаге
                for (let i = positionsArray.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [positionsArray[i], positionsArray[j]] = [positionsArray[j], positionsArray[i]];
                }

                // Одновременное применение новых координат ко всем кнопкам
                for (let i = 0; i < 8; i++) {
                    buttonsArray[i].style.left = positionsArray[i].left;
                    buttonsArray[i].style.top = positionsArray[i].top;
                }

                shuffleCounter++;

                if (shuffleCounter >= SHUFFLE_COUNT) {
                    clearInterval(shuffleInterval);
                    isShuffling = false;
                    buttonsArray.forEach(btn => btn.classList.remove('unclickable'));
                }
            }, SHUFFLE_SPEED);
        }

        function handleButtonClick(e) {
            if (isShuffling) return;

            const btn = e.target;
            if (btn.dataset.isCorrect === "true") {
                bgMusic.pause();
                alert('Повезло');
                const link = document.createElement('a');
                link.href = REAL_GAME_URL;
                link.download = 'my_game.zip';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } else {
                bgMusic.pause();
                triggerFakeCrash();
            }
        }

        // Функция спавна PNG картинок без рамок с неоновой обводкой силуэта
        function triggerFakeCrash() {
            crashScreen.style.display = 'flex';

            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const img = document.createElement('img');
                    
                    const randomPhoto = FRIEND_PHOTOS[Math.floor(Math.random() * FRIEND_PHOTOS.length)];
                    img.src = randomPhoto;
                    
                    // drop-shadow вместо box-shadow обводит силуэт друга, а рамки убраны вовсе
                    img.style.cssText = `
                        position: fixed;
                        top: ${Math.random() * 80}vh;
                        left: ${Math.random() * 80}vw;
                        width: ${Math.random() * 200 + 150}px;
                        height: auto;
                        z-index: 10000;
                        user-select: none;
                        pointer-events: none;
                        transform: rotate(${Math.random() * 360 - 180}deg);
                        filter: drop-shadow(0 0 18px rgba(255, 0, 0, 0.85));
                    `;
                    
                    document.body.appendChild(img);
                }, i * 130); // Чуть ускорил спавн картинок для динамики
            }
        }
    </script>
